<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Ball - Feed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: #eee; margin: 0; padding: 0; }
    h1 { text-align: center; margin: 10px 0; }
    #filters { padding: 10px; display: flex; gap: 10px; overflow-x: auto; background: #1a1a1a; }
    .chip { padding: 5px 10px; border-radius: 15px; background: #444; cursor: pointer; white-space: nowrap; user-select: none; }
    .chip.active { background: #E31337; color: #fff; }
    #map { height: 300px; width: 100%; display: none; background: #333; }
    #map.active { display: block; }
    #feed { padding: 10px; max-width: 600px; margin: 0 auto; }
    .op { background: #1a1a1a; border-left: 4px solid #fff; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
    .op a { color: #E31337; text-decoration: none; }
    .op a:hover { text-decoration: underline; }
    .time { font-size: 0.8em; color: #888; }
    .loading { text-align: center; padding: 20px; color: #888; }
  </style>
</head>
<body>
  <h1>The Ball - Feed</h1>
  <div id="filters"><div class="chip active" data-ball="">All Balls</div></div>
  <div id="map"></div>
  <div id="feed"></div>
  <div id="loader" class="loading">Loading...</div>
  
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="./geohash.js"></script>
  <script src="./feed.js"></script>
</body>
</html>
